<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Adefemi Oluwatobi</title>
  
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%233F8EFC'/><text x='50' y='65' font-size='40' font-family='Arial, sans-serif' text-anchor='middle' fill='white' font-weight='bold'>AO</text></svg>">

  <style>
    /* 404 Specific Styles */
    body {
      background-color: #f7f6f1; /* Match the cream background from mockup */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      text-align: center;
    }
    .error-container {
      max-width: 700px;
      padding: 2rem;
    }
    .error-code {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(8rem, 15vw, 15rem);
      font-weight: 900;
      color: #1a2236;
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: -5px;
    }
    .error-zero {
      display: inline-block;
      width: clamp(90px, 16vw, 160px);
      height: clamp(90px, 16vw, 160px);
      margin: 0 1rem;
      position: relative;
    }
    .error-zero svg {
      width: 100%;
      height: 100%;
    }
    .error-title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      color: #1a2236;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .error-title .highlight {
      color: var(--brand); /* Signature brand blue */
    }
    .leaves-icon {
      width: 32px;
      height: 32px;
      margin-bottom: 25px; /* Adjusting alignment to match mockup */
    }
    .error-desc {
      font-size: 1rem;
      color: #666;
      margin-bottom: 2.5rem;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }
    .home-btn {
      background-color: #191614;
      color: #fff;
      padding: 0.9rem 2.5rem;
      border-radius: 99px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: background-color 0.3s, transform 0.2s;
      display: inline-block;
    }
    .home-btn:hover {
      background-color: var(--brand);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">
      <span>4</span>
      <div class="error-zero">
        <!-- SVG for the horizontally sliced '0' -->
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="horizontal-cut">
              <rect x="0" y="0" width="100" height="42" />
              <rect x="0" y="58" width="100" height="42" />
            </clipPath>
          </defs>
          <circle cx="50" cy="50" r="34" fill="none" stroke="var(--brand)" stroke-width="32" clip-path="url(#horizontal-cut)" />
        </svg>
      </div>
      <span>4</span>
    </div>
    
    <div class="error-title">
      Oops! <span class="highlight">Page not Found</span>
      <!-- Abstract leaves icon -->
      <svg class="leaves-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 20 Q 25 10, 35 10 Q 35 20, 20 20 Z" fill="#1a2236"/>
        <path d="M18 22 Q 16 10, 25 5 Q 30 12, 18 22 Z" fill="#1a2236"/>
        <path d="M22 22 Q 35 16, 40 25 Q 30 30, 22 22 Z" fill="#1a2236"/>
      </svg>
    </div>
    
    <div class="error-desc">
      The page you are looking for cannot be found. take a break before trying again
    </div>
    
    <a href="index.html" class="home-btn">Go to Home Page</a>
  </div>
</body>
</html>
